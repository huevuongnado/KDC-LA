name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish ThonLongAn.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Decode project signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Missing debug.keystore.base64" >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare ThonLongAn.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ThonLongAn.apk
          ls -lh ThonLongAn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThonLongAn-APK
          path: ThonLongAn.apk

      - name: Publish public download link via GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Thôn Long An - Tải ứng dụng Android (APK)"
          body: |
            Nhấn vào file **ThonLongAn.apk** bên dưới để tải về và cài đặt trên điện thoại Android.
          files: ThonLongAn.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
