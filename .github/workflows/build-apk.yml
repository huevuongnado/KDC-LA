name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish ThonLongAn.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            set +e
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1
            set -e
          fi

      - name: Prepare signing keystore & extract SHA-1
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "SOURCE=repo" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "SOURCE=secret" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "SOURCE=generated" >> "$GITHUB_OUTPUT"
          fi
          SHA1=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | awk '/SHA1:/ {print $2; exit}')
          SHA256=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | awk '/SHA256:/ {print $2; exit}')
          echo "SHA1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
                printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
              fi
            else
              echo "Thieu GitHub Secret GOOGLE_SERVICES_JSON. Vui long them noi dung tep app/google-services.json vao Repository Secrets." >&2
              exit 1
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare ThonLongAn.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ThonLongAn.apk
          ls -lh ThonLongAn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThonLongAn-APK
          path: ThonLongAn.apk

      - name: Publish public download link via GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Thôn Long An - Tải ứng dụng Android (APK)"
          body: |
            Nhấn vào file **ThonLongAn.apk** bên dưới để tải về và cài đặt trên điện thoại Android.

            - SHA-1 ký ứng dụng: `${{ steps.keystore.outputs.SHA1 }}`
            - SHA-256 ký ứng dụng: `${{ steps.keystore.outputs.SHA256 }}`
          files: ThonLongAn.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
